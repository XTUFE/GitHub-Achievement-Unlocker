name: Create and Merge Pull Request

on:
  workflow_dispatch:
    inputs:
      pr_title:
        description: "Pull request title"
        required: true
        default: "Automated project update"
        type: string
      pr_body:
        description: "Short description of the changes"
        required: true
        default: "Automatically selected branch with existing commits ahead of main."
        type: string
      merge_method:
        description: "How to merge the pull request"
        required: true
        type: choice
        options:
          - squash
          - merge
          - rebase
        default: squash

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: create-merge-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out all branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find branch containing real commits
        id: select
        env:
          BASE_BRANCH: main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          best_branch=""
          best_ahead=0

          while IFS= read -r ref; do
            branch="${ref#origin/}"
            [[ "$branch" == "$BASE_BRANCH" ]] && continue
            [[ "$branch" == "HEAD" ]] && continue

            ahead="$(git rev-list --count "origin/$BASE_BRANCH..$ref")"
            if (( ahead > best_ahead )); then
              best_ahead="$ahead"
              best_branch="$branch"
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin)

          if [[ -z "$best_branch" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No branch contains commits ahead of $BASE_BRANCH. No PR will be created."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "head_branch=$best_branch" >> "$GITHUB_OUTPUT"
            echo "ahead=$best_ahead" >> "$GITHUB_OUTPUT"
            echo "Selected branch: $best_branch ($best_ahead commits ahead of $BASE_BRANCH)"
          fi

      - name: Create or reuse pull request
        id: pr
        if: steps.select.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ steps.select.outputs.head_branch }}
          BASE_BRANCH: main
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GH_REPO" --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            number="$existing"
            echo "Reusing open PR #$number"
          else
            url="$(gh pr create --repo "$GH_REPO" --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --title "$PR_TITLE" --body "$PR_BODY")"
            number="${url##*/}"
            echo "Created PR #$number"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$GH_REPO/pull/$number" >> "$GITHUB_OUTPUT"

      - name: Merge pull request
        if: steps.select.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MERGE_METHOD: ${{ inputs.merge_method }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" "--$MERGE_METHOD"
          echo "Merged PR #$PR_NUMBER"

      - name: Publish result
        if: steps.select.outputs.has_changes == 'true'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_BRANCH: ${{ steps.select.outputs.head_branch }}
        run: |
          {
            echo "## Pull request processed"
            echo
            echo "- Selected branch: $HEAD_BRANCH"
            echo "- PR: $PR_URL"
            echo "- Number: #$PR_NUMBER"
            echo "- Result: merge command completed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain no-op run
        if: steps.select.outputs.has_changes != 'true'
        run: |
          {
            echo "## Nothing to merge"
            echo
            echo "No existing branch contains commits ahead of main."
            echo "Create or push a branch with real project changes, then run this workflow again."
          } >> "$GITHUB_STEP_SUMMARY"
