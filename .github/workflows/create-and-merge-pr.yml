name: Achievement Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which achievement workflow to run"
        required: true
        type: choice
        options:
          - all
          - pull-shark
          - pair
          - quickdraw
          - yolo
        default: all
      count:
        description: "Number of PR cycles (1-20; ignored for Quickdraw)"
        required: true
        type: number
        default: 1
      delay:
        description: "Delay between PR cycles in seconds (minimum 5)"
        required: true
        type: number
        default: 10

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: achievement-automation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run-achievement-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
      GITHUB_BASE_BRANCH: main
      COAUTHOR_NAME: ${{ secrets.COAUTHOR_NAME }}
      COAUTHOR_EMAIL: ${{ secrets.COAUTHOR_EMAIL }}
      MODE: ${{ inputs.mode }}
      COUNT: ${{ inputs.count }}
      DELAY: ${{ inputs.delay }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COUNT" =~ ^[0-9]+$ ]] && (( COUNT >= 1 && COUNT <= 20 ))
          [[ "$DELAY" =~ ^[0-9]+$ ]] && (( DELAY >= 5 && DELAY <= 3600 ))
          if [[ "$MODE" == "pair" || "$MODE" == "all" ]]; then
            test -n "$COAUTHOR_NAME"
            test -n "$COAUTHOR_EMAIL"
          fi

      - name: Run Pull Shark
        if: inputs.mode == 'pull-shark' || inputs.mode == 'all' || inputs.mode == 'yolo'
        run: python Pull_Shark.py --count "$COUNT" --delay "$DELAY"

      - name: Run Pair Extraordinaire
        if: inputs.mode == 'pair' || inputs.mode == 'all'
        run: python Pair_Extraordinaire.py --count "$COUNT" --delay "$DELAY"

      - name: Run Quickdraw
        if: inputs.mode == 'quickdraw' || inputs.mode == 'all'
        run: python Quickdraw.py

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Achievement automation"
            echo
            echo "- Mode: $MODE"
            echo "- PR cycles requested: $COUNT"
            echo "- Actor: @${{ github.actor }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "GitHub determines whether any activity qualifies for achievements."
          } >> "$GITHUB_STEP_SUMMARY"
