name: Create and Merge Pull Request

on:
  workflow_dispatch:
    inputs:
      merge_method:
        description: "How to merge the generated pull request"
        required: true
        type: choice
        options: [squash, merge, rebase]
        default: squash

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: achievement-activity-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-commit-pr-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create a new run record commit
        id: commit
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/run-${RUN_ID}"
          file="activity-runs/run-${RUN_ID}.md"
          mkdir -p activity-runs
          cat > "$file" <<EOF
          # Automated workflow run

          - Repository: ${REPOSITORY}
          - Workflow run: [#${RUN_NUMBER}](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})
          - Triggered by: @${ACTOR}
          - Source revision: ${SHA}
          - Recorded at (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')

          This file is an append-only execution record for the repository's automation.
          EOF
          git checkout -b "$branch"
          git add "$file"
          git commit -m "chore: record automation run ${RUN_NUMBER}"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ steps.commit.outputs.branch }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh pr create --repo "$GH_REPO" --head "$HEAD_BRANCH" --base main --title "chore: record automation run #${RUN_NUMBER}" --body "Adds the execution record generated by workflow run #${RUN_NUMBER} in activity-runs/.")"
          number="${url##*/}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MERGE_METHOD: ${{ inputs.merge_method }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" "--$MERGE_METHOD" --delete-branch
          echo "Merged PR #$PR_NUMBER"

      - name: Publish result
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          FILE: ${{ steps.commit.outputs.file }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          {
            echo "## Commit created and merged"
            echo
            echo "- Branch: $BRANCH"
            echo "- Commit: $COMMIT"
            echo "- Change: $FILE"
            echo "- Pull request: $PR_URL"
            echo "- Result: merged into main"
          } >> "$GITHUB_STEP_SUMMARY"
