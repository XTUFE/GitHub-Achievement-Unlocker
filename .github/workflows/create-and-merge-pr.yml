name: Achievement Automation

on:
  workflow_dispatch:
    inputs:
      issue_title:
        description: "Real project task title"
        required: true
        type: string
      issue_body:
        description: "Task context, expected behavior, and acceptance criteria"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: achievement-automation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-project-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
      ISSUE_TITLE: ${{ inputs.issue_title }}
      ISSUE_BODY: ${{ inputs.issue_body }}
    steps:
      - name: Validate personal access token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GITHUB_TOKEN}" ]]; then
            echo "::error::Add a repository secret named GH_PAT with Issues: Read and write access."
            exit 1
          fi

          token_login="$(gh api user --jq .login)"
          if [[ "${token_login,,}" != "${GITHUB_OWNER,,}" ]]; then
            echo "::error::GH_PAT belongs to @${token_login}, but this workflow targets @${GITHUB_OWNER}."
            exit 1
          fi
          echo "Authenticated as @${token_login}."

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Create the described project issue
        run: python Quickdraw.py

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Project issue automation"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Requested by: @${GITHUB_ACTOR}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Issue creation uses GH_PAT and leaves the issue open for normal project triage."
          } >> "$GITHUB_STEP_SUMMARY"
